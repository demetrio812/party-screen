<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Level Eleven · Remote</title><link rel="stylesheet" href="style.css"><script src="remote.js" defer></script>
<style>body{background:#100811;padding:22px 18px 36px;max-width:640px;margin:auto}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:26px;letter-spacing:-.04em}h2{font-size:17px;margin:26px 0 12px}p{color:#c2adc1;font-size:13px;line-height:1.6}#connection{border-bottom:1px solid #4b3048;padding-bottom:16px}#pin{font-size:28px;letter-spacing:.25em;text-align:center;width:100%;padding:14px;background:#251425;border:1px solid #76516a;border-radius:8px;margin:12px 0}#now{font-size:25px;color:#fff;margin:8px 0}.remote-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.remote-grid button{min-height:66px;text-align:left;touch-action:manipulation}.remote-grid small{display:block;color:#d0bccc;font-size:11px;font-weight:400;margin-top:5px}button:disabled{cursor:default;opacity:.4}#feedback{min-height:22px;color:#ffd0e8}#return{margin-top:12px}#disconnect{font-size:11px;padding:8px}.notice-box{padding:14px;background:#261527;border-radius:9px}#remote-effects button{border-left:3px solid #ff3296}</style></head>
<body><header><h1>Party remote <span class="star">✦</span></h1><button id="disconnect" hidden>Unpair</button></header><p id="connection" role="status">Pair with your laptop to run the show.</p>
<form id="pair-form"><h2>Enter the laptop’s code</h2><p>Find Phone control in Party desk. Both devices need the same Wi-Fi.</p><label for="pin">Pairing code</label><input id="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button class="primary wide" id="join">Connect to party</button></form>
<div id="controls" hidden><div class="notice-box"><span class="live-label">On screen</span><div id="now">Waiting for laptop</div><p id="return-note"></p><button id="return" class="wide" hidden>Return to previous moment</button></div><p id="feedback" role="status"></p><h2>Moments</h2><div id="remote-moments" class="remote-grid"></div><h2>Fire an effect</h2><div id="remote-effects" class="remote-grid"></div><button id="clear" class="wide" style="margin-top:12px">Clear effects</button><p>The laptop handles the microphone and projector. Keep Party desk open there.</p></div></body></html>
